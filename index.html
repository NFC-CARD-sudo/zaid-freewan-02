v<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zaid Freewan</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #be123c;
    --red-light: #fda4af;
    --bg: #fff1f2;
    --card-bg: #ffffff;
    --glass: rgba(225,29,72,0.09);
    --border: rgba(225,29,72,0.20);
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
 
  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(225,29,72,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(225,29,72,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 50% 50%, #eff6ff 0%, #93c5fd 100%);
    z-index: 0;
  }
 
  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--red);
    border-radius: 50%;
    opacity: 0;
    animation: float-up linear infinite;
  }
  @keyframes float-up {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }
 
  .card-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 20px;
    animation: card-enter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(40px);
  }
  @keyframes card-enter {
    to { opacity: 1; transform: translateY(0); }
  }
 
  .card {
    background: var(--card-bg);
    border-radius: 32px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(225,29,72,0.12),
      0 20px 60px rgba(225,29,72,0.15),
      0 4px 20px rgba(0,0,0,0.06);
    backdrop-filter: blur(20px);
  }
 
  /* Header / Cover */
  .card-header {
    position: relative;
    height: 160px;
    background: linear-gradient(135deg, #93c5fd 0%, #93c5fd 50%, #93c5fd 100%);
    overflow: hidden;
  }
  .card-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(255,255,255,0.07) 40px, rgba(255,255,255,0.07) 41px),
      repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(255,255,255,0.07) 40px, rgba(255,255,255,0.07) 41px);
  }
  .card-header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 80px;
    background: linear-gradient(to bottom, transparent, #ffffff);
  }
 
  .header-red-line {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
  }
 
  /* NFC Badge */
  .nfc-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.40);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--red-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .nfc-dot {
    width: 6px; height: 6px;
    background: var(--red);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.6); }
  }
 
  /* Avatar */
  .avatar-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    margin: -55px auto 0;
    z-index: 10;
  }
  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #e11d48, #fda4af, #ffffff, #e11d48);
    animation: spin-ring 4s linear infinite;
  }
  @keyframes spin-ring {
    to { transform: rotate(360deg); }
  }
  .avatar-ring-mask {
    position: absolute;
    inset: 2px;
    border-radius: 50%;
    background: var(--card-bg);
  }
  .avatar {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(225,29,72,0.45);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
 
  /* Profile Info */
  .profile-info {
    text-align: center;
    padding: 20px 24px 0;
  }
  .profile-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 3px;
    color: #0a0a0a;
    line-height: 1;
    margin-bottom: 6px;
  }
  .profile-handle {
    font-size: 13px;
    color: #000000;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .profile-divider {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--red), transparent);
    margin: 14px auto;
  }
 
  /* Social Links */
  .socials {
    padding: 0 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
 
  .social-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 16px;
    background: #f8faff;
    border: 1px solid rgba(225,29,72,0.10);
    text-decoration: none;
    color: #000000;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .social-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .social-btn:hover { transform: translateX(-4px); background: #fff1f2; }
  .social-btn:hover::before { opacity: 1; }
  .social-btn:active { transform: scale(0.97); }
 
  /* Instagram */
  .btn-instagram::before {
    background: linear-gradient(135deg, rgba(225,48,108,0.15), rgba(193,53,132,0.1), rgba(131,58,180,0.1));
  }
  .btn-instagram:hover {
    border-color: rgba(225,48,108,0.4);
    box-shadow: 0 8px 32px rgba(225,48,108,0.2);
  }
 
  /* Snapchat */
  .btn-snapchat::before {
    background: linear-gradient(135deg, rgba(255,252,0,0.12), rgba(255,200,0,0.08));
  }
  .btn-snapchat:hover {
    border-color: rgba(255,252,0,0.4);
    box-shadow: 0 8px 32px rgba(255,252,0,0.15);
  }
 
  /* WhatsApp */
  .btn-whatsapp::before {
    background: linear-gradient(135deg, rgba(37,211,102,0.15), rgba(18,140,126,0.1));
  }
  .btn-whatsapp:hover {
    border-color: rgba(37,211,102,0.4);
    box-shadow: 0 8px 32px rgba(37,211,102,0.2);
  }
 
  .social-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
    position: relative;
    overflow: hidden;
  }
  .social-icon img {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }
 
  .icon-instagram {
    background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
  .icon-snapchat {
    background: #FFFC00;
  }
  .icon-whatsapp {
    background: linear-gradient(135deg, #25d366, #128c7e);
  }
 
  .social-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .social-platform {
    font-size: 11px;
    color: rgba(225,29,72,0.55);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .social-username {
    font-size: 15px;
    font-weight: 700;
    color: #000000;
    letter-spacing: 0.3px;
  }
 
  .social-arrow {
    font-size: 16px;
    color: rgba(225,29,72,0.30);
    transition: all 0.3s;
  }
  .social-btn:hover .social-arrow {
    color: rgba(225,29,72,0.85);
    transform: translateX(-4px);
  }
 
  /* Logo row */
  .logos-section {
    padding: 8px 20px 20px;
  }
  .logos-label {
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(225,29,72,0.55);
    margin-bottom: 14px;
  }
  .logos-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    align-items: center;
  }
  .logo-item {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(225,29,72,0.15);
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: all 0.3s;
  }
  .logo-item:hover {
    border-color: rgba(225,29,72,0.40);
    transform: scale(1.08);
  }
  .logo-item img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
 
  /* Footer */
  .card-footer {
    padding: 16px 24px;
    border-top: 1px solid rgba(225,29,72,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .footer-nfc {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(225,29,72,0.45);
  }
  .footer-dot { color: var(--red); opacity: 0.6; font-size: 8px; }
 
  /* SVG Icons */
  .ig-svg { width: 22px; height: 22px; fill: white; }
  .wa-svg { width: 22px; height: 22px; fill: white; }
</style>
</head>

  </div>
</div>
 
<script>
// Generate floating particles
const container = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    width: ${Math.random() * 3 + 1}px;
    height: ${Math.random() * 3 + 1}px;
    animation-duration: ${Math.random() * 15 + 10}s;
    animation-delay: ${Math.random() * 15}s;
    opacity: ${Math.random() * 0.5 + 0.1};
  `;
  container.appendChild(p);
}
 
// Ripple effect on buttons
document.querySelectorAll('.social-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const ripple = document.createElement('span');
    const rect = this.getBoundingClientRect();
    ripple.style.cssText = `
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      width: 200px; height: 200px;
      left: ${e.clientX - rect.left - 100}px;
      top: ${e.clientY - rect.top - 100}px;
      transform: scale(0);
      animation: ripple-out 0.6s ease-out forwards;
      pointer-events: none;
    `;
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  });
});
 
const style = document.createElement('style');
style.textContent = `
  @keyframes ripple-out {
    to { transform: scale(3); opacity: 0; }
  }
`;
document.head.appendChild(style);
</script>
</body>
</html>
